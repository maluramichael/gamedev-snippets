<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>update-loop (Python)</title>
<link rel="stylesheet" href="/_shared/site.css">
<style>
  html, body { margin: 0; height: 100%; background: #fafaf9; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: "JetBrains Mono", monospace; }
  canvas { display: block; aspect-ratio: 16 / 9; width: min(100vw, calc((100vh - var(--bar, 0px)) * 16 / 9)) !important; height: auto !important; }
  #status { position: fixed; top: 50%; left: 0; right: 0; text-align: center; color: #6b7280; font-size: 14px; }
  .demo-bar { width: 100%; }
</style>
</head>
<body>
<canvas id="canvas" width="960" height="540"></canvas>
<p id="status">Loading Python ...</p>
<noscript>This demo needs JavaScript and WebAssembly.</noscript>
<script type="module" src="/_shared/bar.js"></script>
<script type="module">
  const status = document.getElementById("status");
  try {
    const { loadPyodide } = await import("/_shared/pyodide/pyodide.mjs");
    const pyodide = await loadPyodide({ indexURL: "/_shared/pyodide/" });
    status.textContent = "Loading pygame-ce ...";
    await pyodide.loadPackage("pygame-ce");
    for (const name of ["stepper.py", "main.py"]) {
      const response = await fetch(name);
      pyodide.FS.writeFile(name, await response.text());
    }
    for (const name of ["JetBrainsMono-Regular.ttf", "JetBrainsMono-Bold.ttf"]) {
      const response = await fetch(name);
      pyodide.FS.writeFile(name, new Uint8Array(await response.arrayBuffer()));
    }
    pyodide.canvas.setCanvas2D(document.getElementById("canvas"));
    status.textContent = "";
    await pyodide.runPythonAsync("import main\nawait main.main()");
  } catch (error) {
    status.textContent = "The demo could not start: " + error.message;
  }
</script>
</body>
</html>
